<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Study Room</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <h1>Study Room & Doubt Solver</h1>

      <!-- Authentication Section -->
      <div id="auth-section">
        <h2>Join a Room</h2>
        <input
          type="text"
          id="username"
          placeholder="Enter Username"
          required
        />
        <input
          type="password"
          id="password"
          placeholder="Enter Password"
          required
        />
        <button id="register-btn">Register</button>
        <button id="login-btn">Login</button>
        <p id="auth-message" style="color: red"></p>
      </div>

      <!-- Chat Section (Hidden until logged in) -->
      <div id="chat-section" style="display: none">
        <div id="connection-status">Connecting...</div>

        <!-- Room Selection -->
        <div
          id="room-selection"
          style="
            margin-top: 15px;
            padding: 15px;
            background: #ecf0f1;
            border-radius: 8px;
          "
        >
          <h3 style="margin-bottom: 10px">Join or Create a Room</h3>

          <div
            style="
              display: flex;
              gap: 10px;
              margin-bottom: 15px;
              justify-content: center;
            "
          >
            <button
              id="create-room-btn"
              style="
                background-color: #27ae60;
                color: white;
                padding: 8px 15px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
              "
            >
              Generate New Room ID
            </button>
          </div>

          <div style="display: flex; gap: 10px; justify-content: center">
            <input
              type="text"
              id="room-id-input"
              placeholder="Enter Room ID"
              style="
                padding: 8px;
                border-radius: 6px;
                border: 1px solid #bdc3c7;
              "
            />
            <button
              id="join-room-btn"
              style="
                background-color: #9b59b6;
                color: white;
                padding: 8px 15px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
              "
            >
              Join Room
            </button>
          </div>
        </div>

        <!-- Chat Box & Input -->
        <div id="chat-interface" style="display: none; margin-top: 20px">
          <div
            style="
              display: flex;
              align-items: center;
              border-bottom: 2px solid #ecf0f1;
              margin-bottom: 10px;
              padding-bottom: 5px;
            "
          >
            <h3 id="current-room-title" style="margin: 0; color: #34495e"></h3>
            <span
              id="user-count-display"
              style="
                font-size: 14px;
                color: #2ecc71;
                margin-left: 15px;
                font-weight: bold;
              "
            ></span>
          </div>

          <div
            id="chat-box"
            style="
              border: 1px solid #ccc;
              height: 300px;
              overflow-y: auto;
              padding: 10px;
              margin-bottom: 10px;
              background: #f9f9f9;
            "
          >
            <!-- Messages will appear here -->
          </div>

          <div
            id="typing-indicator"
            style="
              font-size: 12px;
              color: #888;
              font-style: italic;
              height: 18px;
              margin-bottom: 5px;
            "
          ></div>

          <div class="input-group">
            <input
              type="text"
              id="message-input"
              placeholder="Type your doubt or answer..."
              style="width: 70%; padding: 5px"
            />
            <button id="send-btn" style="padding: 5px 10px">Send</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Socket.IO Client Script fetched directly from your local backend -->
    <script src="https://chat-room-37nx.onrender.com/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
